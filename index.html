<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <title>EDIT — 横断クローゼット</title>
  <meta name="theme-color" content="#EDECE8" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="EDIT" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icon-128.png" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="app.css" />
</head>
<body>
  <div id="app"></div>
  <script src="chrome-shim.js"></script>
  <script src="bookmarklet.js"></script>
  <script type="module" src="popup.js"></script>
  <script>
    // Register SW and auto-refresh once when a new version takes over, so
    // redeploys reach the phone without manual cache-clearing.
    if ("serviceWorker" in navigator) {
      let reloaded = false;
      // Only auto-reload on a GENUINE update. On first install the SW's clients.claim()
      // also fires controllerchange; reloading then can abort an in-flight
      // "Share → EDIT" capture (its URL was already stripped). So skip when there
      // was no controller at load time.
      const hadController = !!navigator.serviceWorker.controller;
      navigator.serviceWorker.addEventListener("controllerchange", () => {
        if (reloaded || !hadController) return; reloaded = true; location.reload();
      });
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("sw.js").then((reg) => {
          reg.update().catch(() => {});
          setInterval(() => reg.update().catch(() => {}), 60000); // check for updates periodically
        }).catch(() => {});
      });
    }
  </script>
</body>
</html>
