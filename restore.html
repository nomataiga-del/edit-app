<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <!-- Deliberately NO manifest link: Chrome's「ホーム画面に追加」on this page makes a
       plain shortcut that keeps this URL (the restore key) on the launcher —
       outside the browser's wipeable storage. One tap re-provisions and restores. -->
  <title>EDIT 復元</title>
  <style>
    body{font-family:system-ui,-apple-system,sans-serif;background:#EDECE8;color:#1B1A18;margin:0;padding:28px 20px;line-height:1.7}
    h1{font-size:20px;margin:0 0 6px;letter-spacing:.04em}
    .btn{display:block;width:100%;box-sizing:border-box;text-align:center;padding:14px;border-radius:12px;background:#1B1A18;color:#EDECE8;text-decoration:none;font-weight:600;margin:18px 0 12px}
    .note{font-size:13.5px;color:#4a4740;background:#FBFBF9;border:1px solid #DEDCD4;border-radius:12px;padding:12px 14px}
    .note b{color:#1B1A18}
    .err{color:#CC3B33}
    ol{padding-left:1.3em;margin:8px 0 0}
  </style>
</head>
<body>
  <h1>EDIT 復元</h1>
  <p id="msg">クラウドからデータを復元して EDIT を開きます…</p>
  <a id="go" class="btn" href="#">復元して開く</a>
  <div class="note" id="howto" hidden>
    <b>このページをホーム画面に置くと、データが消えても1タップで元に戻ります。</b>
    <ol>
      <li>Chrome のメニュー ⋮ → <b>「ホーム画面に追加」</b></li>
      <li>名前を「EDIT 復元」にして追加</li>
    </ol>
    以後、アプリが空っぽになっていたら、そのアイコンを1回タップするだけで設定ごと復元されます。
  </div>
  <script>
    (function () {
      var p = new URLSearchParams(location.search);
      var t = (p.get("sync") || "").trim(), w = (p.get("worker") || "").trim();
      var msg = document.getElementById("msg"), go = document.getElementById("go"), howto = document.getElementById("howto");
      if (!/^[A-Za-z0-9_-]{16,}$/.test(t)) {
        msg.innerHTML = '<span class="err">復元用のキーがURLにありません。EDIT の ⋯→クラウド同期 →「📱 ホーム画面に復元アイコン」からこのページを開いてください。</span>';
        go.hidden = true; return;
      }
      var target = "./?sync=" + encodeURIComponent(t) + (w ? "&worker=" + encodeURIComponent(w) : "");
      go.href = target;
      // Opened from inside the app (setup) -> show how to pin it, and wait.
      // Opened from the home-screen shortcut (no referrer) -> restore right away.
      var fromApp = /edit-app|localhost/.test(document.referrer || "");
      if (fromApp) { howto.hidden = false; msg.textContent = "復元アイコンの設定ページです。"; }
      else { setTimeout(function () { location.replace(target); }, 900); }
    })();
  </script>
</body>
</html>
