# Builds the EDIT Android shell (android-shell/) into a signed APK and attaches it
# to a GitHub Release (tag android-v<version>), then smoke-tests it on an emulator.
name: android
on:
  push:
    branches: [main]
    paths: ["android-shell/**", ".github/workflows/android.yml"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android-shell
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          accept-android-sdk-licenses: true
      - run: npm ci --no-audit --no-fund
      - run: npx cap sync android
      - name: Keystore (signed release when the secret exists, debug build otherwise)
        env:
          KS: ${{ secrets.EDIT_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/edit-release.p12"
            echo "EDIT_KEYSTORE_PATH=$RUNNER_TEMP/edit-release.p12" >> "$GITHUB_ENV"
            echo "signed release build"
          else
            echo "no keystore secret -> debug build"
          fi
      - name: Build APK
        env:
          EDIT_KEYSTORE_PASSWORD: ${{ secrets.EDIT_KEYSTORE_PASSWORD }}
          EDIT_KEY_ALIAS: ${{ secrets.EDIT_KEY_ALIAS }}
        run: |
          cd android && chmod +x gradlew
          if [ -n "$EDIT_KEYSTORE_PATH" ]; then
            ./gradlew assembleRelease --no-daemon -q
            cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/EDIT-android.apk"
          else
            ./gradlew assembleDebug --no-daemon -q
            cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/EDIT-android.apk"
          fi
      - name: APK facts
        id: meta
        run: |
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          BT=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          "$ANDROID_HOME/build-tools/$BT/aapt2" dump badging "$RUNNER_TEMP/EDIT-android.apk" | grep -E "^package|launchable-activity|sdkVersion|targetSdkVersion|application-label:"
          "$ANDROID_HOME/build-tools/$BT/apksigner" verify --print-certs "$RUNNER_TEMP/EDIT-android.apk" | grep -E "Signer|DN|SHA-256" | head -4
          ls -l "$RUNNER_TEMP/EDIT-android.apk"
          sha256sum "$RUNNER_TEMP/EDIT-android.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: EDIT-android.apk
          path: ${{ runner.temp }}/EDIT-android.apk
      - name: Attach to Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="android-v${{ steps.meta.outputs.version }}"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "EDIT Android $TAG" --notes "EDIT Android shell (android-shell/). Install EDIT-android.apk on the phone; see android-shell/README.md."
          gh release upload "$TAG" "$RUNNER_TEMP/EDIT-android.apk" --clobber
          echo "https://github.com/${GITHUB_REPOSITORY}/releases/tag/$TAG"
  smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: EDIT-android.apk
          path: apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Launch + share on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: |
            adb install -r apk/EDIT-android.apk
            adb logcat -c
            adb shell am start -n io.github.nomataiga.edit/.MainActivity
            sleep 30
            adb shell am start -a android.intent.action.SEND -t text/plain --es android.intent.extra.TEXT "https://example.com/products/test-jacket" -n io.github.nomataiga.edit/.MainActivity
            sleep 12
            adb logcat -d > logcat.txt
            echo "--- EDIT / Capacitor lines ---"
            grep -E " EDIT |Capacitor" logcat.txt | head -40 || true
            echo "--- resumed activity ---"
            adb shell dumpsys activity activities | grep -E "ResumedActivity" | head -2 || true
            if grep -q "FATAL EXCEPTION" logcat.txt; then echo "CRASH"; grep -A 25 "FATAL EXCEPTION" logcat.txt | head -60; exit 1; fi
            grep -q "share -> https://nomataiga-del.github.io/edit-app/?text=" logcat.txt && echo "SHARE OK" || { echo "share log missing"; exit 1; }
            adb shell dumpsys activity activities | grep -q "io.github.nomataiga.edit/.MainActivity" && echo "ACTIVITY OK" || { echo "activity not running"; exit 1; }
