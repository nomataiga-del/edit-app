# Android 版でお気に入りが消えないかを、エミュレータの実物で確かめる（配布ファイルと Release には触れない）。
name: android-persist
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["ci-persist/**", ".github/workflows/android-persist.yml"]
permissions:
  contents: read
concurrency:
  group: android-persist
  cancel-in-progress: true
jobs:
  persist:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          accept-android-sdk-licenses: true
      - name: Build the debug variant (same code as the released APK)
        working-directory: android-shell
        run: |
          npm ci --no-audit --no-fund
          npx cap sync android
          cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon -q
          mkdir -p "$GITHUB_WORKSPACE/apk-debug"
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/apk-debug/EDIT-android-debug.apk"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Persistence test on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: bash ci-persist/persist.sh
